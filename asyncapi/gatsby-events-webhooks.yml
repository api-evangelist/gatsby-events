description: 'Gatsby provides three webhook types:'
events:
- event: Event Created or Deleted
  description: Fires when you create a new event or cancel an existing one.
- event: Guest Created or Edited
  description: Fires when someone new joins your guest list or when existing guests change their RSVP status.
- event: Sync Entire Guest List
  description: Manually triggered from within Gatsby when you want to push all guest data at once.
